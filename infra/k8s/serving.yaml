apiVersion: v1
kind: Namespace
metadata:
  name: mlops-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-platform
  namespace: mlops-platform
data:
  MLOPS_STAGE: "Production"
  MLOPS_LOG_LEVEL: "INFO"
  MLOPS_DRIFT_ALERT_PSI: "0.2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-platform
  namespace: mlops-platform
  labels:
    app: mlops-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mlops-platform
      track: stable
  template:
    metadata:
      labels:
        app: mlops-platform
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/example/mlops-platform:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: mlops-platform
          env:
            - name: MLOPS_REGISTRY_DIR
              value: /models/registry
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mlops-models
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-platform
  namespace: mlops-platform
spec:
  selector:
    app: mlops-platform
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mlops-platform
  namespace: mlops-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mlops-platform
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlops-platform
  namespace: mlops-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mlops-platform
