name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q
      - name: Train locally
        run: python scripts/train.py
      - name: Image
        run: docker build -t mlops-platform:ci .
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --skip-editable
      - name: Secret scan
        run: |
          if grep -RInE 'AKIA[0-9A-Z]{16}|BEGIN (RSA |OPENSSH )?PRIVATE KEY' --exclude-dir=.git --exclude-dir=.venv --exclude-dir=.pytest_cache --exclude-dir=.ruff_cache .; then
            echo "possible secret found" >&2
            exit 1
          fi
